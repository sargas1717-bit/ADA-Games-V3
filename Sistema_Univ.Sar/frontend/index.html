<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motor Universal Adagames — Sistema_Univ.Sar</title>
    <meta name="description" content="Motor de competencia modular y expandible para múltiples categorías de robótica.">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .animate-fadeIn { animation: fadeIn 0.35s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .custom-scrollbar::-webkit-scrollbar { height: 5px; width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        html, body { overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <!--
    =======================================================================
    CARGA MODULAR — Sistema_Univ.Sar
    Orden: plugins → core → vistas → app
    Si una sección falla, solo ese archivo es el responsable.
    =======================================================================
    -->

    <!-- 1. PLUGINS: Registro de categorías y motores de puntuación -->
    <script type="text/babel" src="plugins.js?v=15" data-presets="react"></script>

    <!-- 2. CORE: Autenticación -->
    <script type="text/babel" src="core_auth.js?v=15" data-presets="react"></script>

    <!-- 3. CORE: Sincronización, timers, polling -->
    <script type="text/babel" src="core_sync.js?v=15" data-presets="react"></script>

    <!-- 4. CORE: UI compartida (Icon, Toast, Dialog, SaveIndicator, SchoolLogo) -->
    <script type="text/babel" src="core_ui.js?v=15" data-presets="react"></script>

    <!-- 5. VISTA: Registro de Equipos -->
    <script type="text/babel" src="view_registro.js?v=15" data-presets="react"></script>

    <!-- 6. VISTA: Inspección Técnica + Modal Auditoría (Modo Contingencia) -->
    <script type="text/babel" src="view_inspeccion.js?v=15" data-presets="react"></script>

    <!-- 7. VISTA: Jueces / Usuarios -->
    <script type="text/babel" src="view_jueces.js?v=15" data-presets="react"></script>

    <!-- 8. VISTA: Pistas (configuración de mapas y secuencias) -->
    <script type="text/babel" src="view_pistas.js?v=15" data-presets="react"></script>

    <!-- 9. VISTA: Fases (promoción masiva, matriz de rondas) -->
    <script type="text/babel" src="view_fases.js?v=15" data-presets="react"></script>

    <!-- 10. VISTA: Sistema (cronómetros globales, reset) -->
    <script type="text/babel" src="view_sistema.js?v=15" data-presets="react"></script>

    <!-- 11. PANELES DE EVALUACIÓN POR CATEGORÍA -->
    <!-- Si falla uno, el resto sigue funcionando -->
    <script type="text/babel" src="view_eval_quest.js?v=15" data-presets="react"></script>
    <script type="text/babel" src="view_eval_lf.js?v=15" data-presets="react"></script>
    <script type="text/babel" src="view_eval_sumo.js?v=15" data-presets="react"></script>
    <script type="text/babel" src="view_eval_stands.js?v=15" data-presets="react"></script>

    <!-- 12. VISTA: Router de Evaluación (inyecta el panel de la categoría activa) -->
    <script type="text/babel" src="view_evaluacion.js?v=15" data-presets="react"></script>

    <!-- 13. VISTA: Ranking con Podio y Modo Suspense -->
    <script type="text/babel" src="view_ranking.js?v=15" data-presets="react"></script>

    <!-- 14. VISTA: Pantalla TV (Individual y Dual) -->
    <script type="text/babel" src="view_tv.js?v=15" data-presets="react"></script>

    <!-- 15. APP: Orquestador principal con Sidebar lateral -->
    <script type="text/babel" src="app.js?v=15" data-presets="react"></script>

</body>
</html>
